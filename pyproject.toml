[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-ticket-agents"
version = "0.1.0"
description = "Academic adversarial ticket-prioritization simulation using Agno agents"
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "agno>=2.9.0,<3",
    "google-genai>=1,<2",
    "pydantic>=2.10,<3",
]

[project.scripts]
adversarial-demo = "adversarial_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

